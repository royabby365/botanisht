plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load the release signing config from android/key.properties (gitignored).
// The upload keystore itself (android/upload-keystore.jks) must be backed up
// somewhere safe — it is the only way to publish updates to Google Play.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.royabernathy.botanisht"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        // Required by flutter_local_notifications (core library desugaring).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Unique application ID (reverse-DNS of royabernathy.info).
        applicationId = "com.royabernathy.botanisht"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"]
                ? file("${rootProject.projectDir}/${keystoreProperties["storeFile"]}")
                : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            // Signed with the upload keystore (Play App Signing holds the
            // actual app-signing key after first upload).
            signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    // Enables core library desugaring required by flutter_local_notifications.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

flutter {
    source = "../.."
}
