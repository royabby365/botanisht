name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.3"
          channel: "stable"

      - run: flutter pub get

      # Strip package attr from isar_flutter_libs manifest (AGP 8.11+ rejects it)
      - name: Patch isar manifest
        run: |
          ISAR_MANIFEST="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/src/main/AndroidManifest.xml"
          if [ -f "$ISAR_MANIFEST" ]; then
            sed -i 's/package="[^"]*"//' "$ISAR_MANIFEST"
          fi

      - run: flutter build apk --debug --android-skip-build-dependency-validation

      # Tagged releases → publish to GitHub Releases
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: true
          make_latest: true